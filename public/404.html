<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0c0c0e" />
  <link rel="icon" type="image/png" sizes="192x192" href="/app-icons/icon-192.png" />
  <title>Page Not Found | Patel Pragnesh</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0c0c0e; color: #f2f2f2; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
    img { width: 88px; height: 88px; }
    p { color: #a8a8b3; line-height: 1.6; }
    a { display: inline-block; margin-top: 12px; color: #20a4f3; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 2px solid #20a4f3; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div>
      <img src="/app-icons/icon-192.png" alt="" />
      <h1>Page Not Found</h1>
      <p>The page you requested could not be found.</p>
      <a href="/">Back to Home</a>
    </div>
  </main>
</body>
</html>
